<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPU & WebGL Canvas Benchmark</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d13;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Stress Viewport in Background */
        #benchmark-canvas {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            opacity: 0.6;
        }

        /* Main Container Card */
        .card-container {
            position: relative;
            z-index: 10;
            background: #121622;
            border: 1px solid #232d42;
            padding: 32px 28px;
            border-radius: 20px;
            width: 92%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: #38bdf8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.desc {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        /* Test Progress Bar */
        .progress-wrapper {
            width: 100%;
            background: #1e2638;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Metrics Data Grid (Only numbers displayed) */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 22px;
            text-align: left;
        }

        .metric-tile {
            background: #181f30;
            border: 1px solid #28354f;
            padding: 12px 14px;
            border-radius: 12px;
        }

        .metric-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Start Test Button */
        .action-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .action-btn:hover {
            background: #1d4ed8;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        /* Pass Score Index Tile */
        .overall-score-tile {
            background: #1e2840;
            border: 1.5px solid #38bdf8;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .overall-score-tile.active {
            display: block;
        }

        .score-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.70rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .score-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="benchmark-canvas"></div>

    <div class="card-container">
        <div class="header-tag">Diagnostics // Build 4.2.0</div>
        <h1>Device Performance Index</h1>
        <p class="desc" id="statusDesc">Evaluates hardware WebGL rasterization, pipeline latency, and draw-call throughput.</p>

        <!-- Progress Tracking -->
        <div class="progress-wrapper">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="timer-display" id="timerDisplay">0.0s / 5.5s</div>

        <!-- Metric Outputs -->
        <div class="metrics-grid">
            <div class="metric-tile">
                <div class="metric-label">FPS (Mean)</div>
                <div class="metric-value" id="valFps">--</div>
            </div>
            <div class="metric-tile">
                <div class="metric-label">Frame Time (ms)</div>
                <div class="metric-value" id="valFrameTime">--</div>
            </div>
            <div class="metric-tile">
                <div class="metric-label">DP Ratio</div>
                <div class="metric-value" id="valDpr">--</div>
            </div>
            <div class="metric-tile">
                <div class="metric-label">Throughput (v/s)</div>
                <div class="metric-value" id="valThroughput">--</div>
            </div>
        </div>

        <!-- Overall Score Result -->
        <div class="overall-score-tile" id="scoreTile">
            <div class="score-title">GPU Performance Index</div>
            <div class="score-number" id="finalScore">0000</div>
        </div>

        <button class="action-btn" id="startBtn" onclick="startBenchmark()">Run Benchmark</button>
    </div>

    <script>
        /* ---------------- Three.js Realtime Stress Engine ---------------- */
        let scene, camera, renderer;
        let stressMeshes = [];
        let lights = [];

        let isRunning = false;
        let testStartTime = 0;
        const TEST_DURATION = 5500; // 5.5 seconds test

        let frameCount = 0;
        let frameTimes = [];
        let totalVerticesRendered = 0;

        function initStressScene() {
            const container = document.getElementById('benchmark-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0d13);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 14);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
            container.appendChild(renderer.domElement);

            // Create 3 Dynamic Moving Lights
            const light1 = new THREE.PointLight(0x38bdf8, 3, 20);
            const light2 = new THREE.PointLight(0xec4899, 3, 20);
            const light3 = new THREE.PointLight(0x818cf8, 2, 20);
            scene.add(light1, light2, light3);
            lights.push(light1, light2, light3);

            // Generate Complex Multi-Torus Stress Ring Objects (150k+ Polygons)
            const torusGeo = new THREE.TorusKnotGeometry(2.4, 0.7, 120, 24);
            const torusMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                metalness: 0.8,
                roughness: 0.2
            });

            for (let i = 0; i < 4; i++) {
                const mesh = new THREE.Mesh(torusGeo, torusMat);
                mesh.position.set((i - 1.5) * 4.2, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 3);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                scene.add(mesh);
                stressMeshes.push(mesh);
            }

            // Display Device Pixel Ratio
            document.getElementById('valDpr').innerText = (window.devicePixelRatio || 1).toFixed(1);

            window.addEventListener('resize', onResize);
            requestAnimationFrame(renderLoop);
        }

        function onResize() {
            if (!renderer || !camera) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function renderLoop(timestamp) {
            requestAnimationFrame(renderLoop);

            const time = timestamp * 0.001;

            // Rotate Meshes & Animate Point Lights
            stressMeshes.forEach((mesh, idx) => {
                mesh.rotation.x += 0.015 * (idx + 1);
                mesh.rotation.y += 0.02 * (idx + 1);
            });

            if (lights.length >= 3) {
                lights[0].position.set(Math.sin(time * 2.5) * 6, Math.cos(time * 2.0) * 4, 3);
                lights[1].position.set(Math.cos(time * 2.2) * 6, Math.sin(time * 2.8) * 4, 3);
                lights[2].position.set(Math.sin(time * 1.5) * 4, Math.sin(time * 2.5) * 4, -2);
            }

            renderer.render(scene, camera);

            // Benchmark Metric Collection
            if (isRunning) {
                frameCount++;
                const elapsed = performance.now() - testStartTime;
                const progressPct = Math.min((elapsed / TEST_DURATION) * 100, 100);

                document.getElementById('progressBar').style.width = progressPct + '%';
                document.getElementById('timerDisplay').innerText = (elapsed / 1000).toFixed(1) + 's / 5.5s';

                // Record frame timing
                const now = performance.now();
                if (window.lastFrameTime) {
                    const delta = now - window.lastFrameTime;
                    frameTimes.push(delta);
                }
                window.lastFrameTime = now;

                if (elapsed >= TEST_DURATION) {
                    finishBenchmark();
                }
            }
        }

        /* ---------------- Benchmark Execution ---------------- */
        function startBenchmark() {
            if (isRunning) return;

            isRunning = true;
            frameCount = 0;
            frameTimes = [];
            testStartTime = performance.now();
            window.lastFrameTime = performance.now();

            const startBtn = document.getElementById('startBtn');
            const scoreTile = document.getElementById('scoreTile');
            const statusDesc = document.getElementById('statusDesc');

            startBtn.disabled = true;
            startBtn.innerText = "Testing...";
            scoreTile.classList.remove('active');
            statusDesc.innerText = "Executing rasterization and geometry stress passes...";

            document.getElementById('valFps').innerText = "--";
            document.getElementById('valFrameTime').innerText = "--";
            document.getElementById('valThroughput').innerText = "--";
        }

        function finishBenchmark() {
            isRunning = false;

            const totalTimeSec = (performance.now() - testStartTime) / 1000;
            const avgFps = Math.round(frameCount / totalTimeSec);

            let sumDelta = 0;
            for (let i = 0; i < frameTimes.length; i++) sumDelta += frameTimes[i];
            const avgFrameTime = (sumDelta / Math.max(1, frameTimes.length)).toFixed(1);

            // Vertices per second calculation (approx 34,560 verts per mesh * 4 meshes * fps)
            const vertsPerFrame = 34560 * 4;
            const throughputM = ((vertsPerFrame * avgFps) / 1000000).toFixed(2);

            // Compute Pure Numeric Capability Index Score
            // Base calculation: (FPS * 60) + (Throughput * 250) / (avgFrameTime)
            const dpr = window.devicePixelRatio || 1;
            const compositeScore = Math.round((avgFps * 75) + (parseFloat(throughputM) * 350 * dpr) - (parseFloat(avgFrameTime) * 10));
            const finalScoreVal = Math.max(850, compositeScore);

            // Display Numeric Outputs
            document.getElementById('valFps').innerText = avgFps;
            document.getElementById('valFrameTime').innerText = avgFrameTime;
            document.getElementById('valThroughput').innerText = throughputM + 'M';
            document.getElementById('finalScore').innerText = finalScoreVal;

            document.getElementById('scoreTile').classList.add('active');
            document.getElementById('statusDesc').innerText = "Benchmark completed. Metric parameters recorded.";

            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = false;
            startBtn.innerText = "Run Again";
        }

        window.addEventListener('DOMContentLoaded', () => {
            initStressScene();
        });
    </script>
</body>
</html>
